<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare | SG Invest Map</title>
<meta name="description" content="Compare up to three products, methods or broker types side by side — risk, liquidity, complexity and real fees.">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<header class="topbar" id="app-header"></header>
<div class="disclaimer" id="app-disclaimer" hidden></div>

<main id="main">
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h1>Compare</h1>
        <p class="muted">Pick up to three products, methods or broker types — from the quiz, or search below.</p>
      </div>

      <label class="sr-only" for="picker-input">Search to add to comparison</label>
      <input id="picker-input" type="search" placeholder="Search products, methods, brokers…" style="width:100%; max-width:420px; border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; background:var(--surface); color:var(--ink)">
      <div class="picker-chips" id="picker-suggestions"></div>
      <div class="picker-chips" id="picker-selected" style="margin-top:10px"></div>

      <div id="compare-empty"></div>

      <div class="section-head" style="margin-top:32px">
        <h2>Side by side</h2>
      </div>
      <div class="chart-wrap" id="radar-wrap" style="max-width:460px; margin-inline:auto"><canvas id="radar-canvas"></canvas></div>
      <div id="radar-table-mount"></div>

      <div class="table-scroll" style="margin-top:20px">
        <table class="data-table compare-table" id="compare-table"></table>
      </div>

      <div class="section-head" style="margin-top:40px">
        <h2>Fee-drag calculator</h2>
        <p class="muted">Compares every provider across the whole site for your scenario.</p>
      </div>
      <div id="calc-mount"></div>
    </div>
  </section>
</main>

<footer class="footer" id="app-footer"></footer>

<script>if (location.protocol === "file:") document.addEventListener("DOMContentLoaded", function () { var m = document.getElementById("main"); if (m) m.insertAdjacentHTML("afterbegin", "<div class=\"wrap\" style=\"padding:24px 16px\"><div class=\"empty-panel\"><h3>Start the local server to use this site</h3><p>Browsers block this page's scripts when opened as a file. In the project folder run:</p><code>npm run serve</code><p>then open http://127.0.0.1:5173</p></div></div>"); });</script>
<script src="../data/sgdata.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module" src="js/compare.js"></script>
</body>
</html>
